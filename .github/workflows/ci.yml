name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax, local links, JSON and heuristic secret check
        run: python3 scripts/check_repository.py
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Offline example smoke
        run: python3 -m src.toy_lora
      - name: Optional recipe dry run only
        run: python3 -m src.optional_peft --mode qlora
